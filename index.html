<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logical Operator Simulator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
            padding: 25px;
            margin-bottom: 20px;
        }
        h3 {
            margin-top: 0;
            color: #1e293b;
            font-size: 1.2rem;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .logic-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 20px;
        }
        .toggle-btn {
            flex: 1;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .btn-true { background-color: #dcfce7; color: #166534; border: 2px solid #86efac; }
        .btn-false { background-color: #fee2e2; color: #991b1b; border: 2px solid #fca5a5; }
        select {
            padding: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
        }
        .result-box {
            background-color: #f1f5f9;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            border: 1px solid #e2e8f0;
        }
        .explanation {
            font-size: 0.9rem;
            color: #64748b;
            text-align: center;
            margin-top: 10px;
            font-weight: normal;
        }
    </style>
</head>
<body>

<div class="container">
    <h3>1. The 'and' / 'or' Simulator</h3>
    <div class="logic-row">
        <button id="btnA" class="toggle-btn btn-true" onclick="toggle('A')">True</button>
        <select id="operator" onchange="evaluateLogic()">
            <option value="and">and</option>
            <option value="or">or</option>
        </select>
        <button id="btnB" class="toggle-btn btn-false" onclick="toggle('B')">False</button>
    </div>
    <div class="result-box">
        Result: <span id="mainResult" style="color: #991b1b;">False</span>
        <div class="explanation" id="mainExp">'and' requires BOTH inputs to be True.</div>
    </div>
</div>

<div class="container">
    <h3>2. The 'not' Simulator</h3>
    <div class="logic-row" style="justify-content: center;">
        <span style="font-size: 1.2rem; font-weight: bold;">not</span>
        <button id="btnNot" class="toggle-btn btn-true" style="max-width: 150px;" onclick="toggleNot()">True</button>
        <span style="font-size: 1.2rem; font-weight: bold;">=</span>
        <div class="result-box" style="flex: 1; margin: 0; padding: 12px;">
            <span id="notResult" style="color: #991b1b;">False</span>
        </div>
    </div>
    <div class="explanation" style="margin-top: 0;">'not' simply reverses the input value.</div>
</div>

<script>
    let stateA = true;
    let stateB = false;
    let stateNot = true;

    function toggle(target) {
        if (target === 'A') stateA = !stateA;
        if (target === 'B') stateB = !stateB;
        updateButtons();
        evaluateLogic();
    }

    function toggleNot() {
        stateNot = !stateNot;
        const btn = document.getElementById('btnNot');
        const res = document.getElementById('notResult');
        btn.className = `toggle-btn ${stateNot ? 'btn-true' : 'btn-false'}`;
        btn.textContent = stateNot ? 'True' : 'False';
        res.textContent = !stateNot ? 'True' : 'False';
        res.style.color = !stateNot ? '#166534' : '#991b1b';
    }

    function updateButtons() {
        document.getElementById('btnA').className = `toggle-btn ${stateA ? 'btn-true' : 'btn-false'}`;
        document.getElementById('btnA').textContent = stateA ? 'True' : 'False';
        document.getElementById('btnB').className = `toggle-btn ${stateB ? 'btn-true' : 'btn-false'}`;
        document.getElementById('btnB').textContent = stateB ? 'True' : 'False';
    }

    function evaluateLogic() {
        const op = document.getElementById('operator').value;
        const resEl = document.getElementById('mainResult');
        const expEl = document.getElementById('mainExp');
        
        let result = false;
        if (op === 'and') {
            result = stateA && stateB;
            expEl.textContent = result ? "'and' returns True because BOTH inputs are True." : "'and' returns False because AT LEAST ONE input is False.";
        } else {
            result = stateA || stateB;
            expEl.textContent = result ? "'or' returns True because AT LEAST ONE input is True." : "'or' returns False because BOTH inputs are False.";
        }
        
        resEl.textContent = result ? 'True' : 'False';
        resEl.style.color = result ? '#166534' : '#991b1b';
    }
</script>

</body>
</html>
